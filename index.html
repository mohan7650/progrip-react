<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>PROGRIP Screws — Pro Hold. Pro Speed.</title>

    <!-- ============================================================
         GOOGLE FONTS
         Russo One = heading font (all H1–H4, titles, buttons)
         Oswald    = body font (paragraphs, labels, descriptions)
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Russo+One&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-inner">
        <div class="splash-logo">PRO<span>+</span>GRIP</div>
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .splash-logo {
        font-family: 'Russo One', sans-serif;
        font-size: clamp(2.5rem, 8vw, 5rem);
        color: #fff;
        letter-spacing: 0.04em;
        line-height: 1;
      }
      .splash-logo span {
        color: #e63329;
      }
      .splash-bar {
        width: 180px;
        height: 3px;
        background: #222;
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-bar-fill {
        height: 100%;
        width: 0%;
        background: #e63329;
        border-radius: 2px;
        animation: fillBar 1.2s ease forwards;
      }
      @keyframes fillBar {
        to { width: 100%; }
      }
    </style>

    <script>
      (function () {
        var splash = document.getElementById('splash-screen');
        var done = false;
        function hideSplash() {
          if (done) return;
          done = true;
          splash.classList.add('hidden');
        }
        window.addEventListener('app-image-ready', hideSplash);
        setTimeout(hideSplash, 5000);
      })();
    </script>
  </body>
</html>
